<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cosmic Mannequin XR</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="menu-principal" class="menu-galactico">
        <h1 id="titulo-juego">MANNEQUIN: COSMIC ECHO</h1>
        <p id="subtitulo">Selecciona tu modo de juego</p>
        
        <div class="pantallas-contenedor">
            <div class="pantalla-lateral" id="stats">
                <h3>ESTADÍSTICAS</h3>
                <p>Maniquíes eliminados: <span id="score">0</span></p>
            </div>
            
            <div class="pantalla-central">
                <button class="btn-modo" onclick="iniciarModo('tutorial')">INICIAR TUTORIAL</button>
                <button class="btn-modo" onclick="iniciarModo('supervivencia')">MODO 1: CAZA Y HUIDA</button>
                <button class="btn-modo" onclick="iniciarModo('entorno')">MODO 2: ECO AMBIENTAL</button>
                <button class="btn-modo-secreto" id="btn-secreto" style="display:none;" onclick="iniciarModo('ton618')">MODO SECRETO: SINGULARIDAD TON 618</button>
            </div>

            <div class="pantalla-lateral" id="hechizos-equipados">
                <h3>HECHIZOS (Máx 3)</h3>
                <p>1. Varita Mágica</p>
                <p>2. Destello Azul / Rojo</p>
                <p>3. Vacío Púrpura</p>
            </div>
        </div>
        <button id="btn-vr">ENTRAR A VR</button>
    </div>

    <div id="controles-movil" style="display: none;">
        <div id="joystick-izquierdo"></div>
        <button id="btn-slowmo">SLOW-MO</button>
        <button id="btn-action">ATACAR / AGARRAR</button>
    </div>

    <script src="habilidades.js"></script>
    <script src="entidades.js"></script>
    <script src="juego.js"></script>
</body>
</html>
