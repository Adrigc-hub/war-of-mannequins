<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mannequin Multiverse: Sorcerer Edition</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #050811; font-family: sans-serif; user-select: none; touch-action: none; }
        
        /* Capas de Interfaz de Usuario */
        #html-ui { position: absolute; z-index: 1000; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .top-hud { display: flex; justify-content: space-between; padding: 12px; pointer-events: auto; gap: 5px; }
        .hud-status { background: rgba(5, 5, 10, 0.85); padding: 10px 16px; border-radius: 20px; border: 1px solid #00ffff; color: #00ffff; font-weight: bold; font-size: 13px; }
        .hud-card { background: rgba(3, 3, 8, 0.96); padding: 8px 12px; border-radius: 6px; border: 1px solid #ffaa00; color: white; font-weight: bold; font-size: 11px; box-shadow: 0 0 10px rgba(255,170,0,0.2); }
        .hud-saves { background: rgba(5, 5, 10, 0.85); padding: 10px 16px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); color: white; font-weight: bold; font-size: 14px; }
        
        #install-bar { position: absolute; top: 12px; left: 12px; z-index: 999999; pointer-events: auto; }
        #btn-pwa-install { background: #ffaa00; color: black; font-weight: bold; border: 2px solid #fff; padding: 10px 16px; border-radius: 8px; cursor: pointer; box-shadow: 0 0 15px #ffaa00; font-size: 11px; }
        
        /* CONTROLES MÓVILES */
        #mobile-controls { position: absolute; bottom: 15px; width: 100%; height: 180px; display: none; justify-content: space-between; padding: 0 25px; box-sizing: border-box; pointer-events: none; z-index: 2000; }
        .joystick-container { width: 110px; height: 110px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; position: relative; pointer-events: auto; margin-top: 40px; }
        #joystick-knob { width: 45px; height: 45px; background: #ffffff; border-radius: 50%; position: absolute; top: 32px; left: 32px; box-shadow: 0 0 12px rgba(0,0,0,0.6); }
        
        .action-container { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; align-items: flex-end; }
        .btn-game { padding: 10px 14px; border-radius: 8px; border: none; color: white; font-weight: bold; font-size: 12px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5); text-transform: uppercase; transition: all 0.1s ease; }
        .btn-game:active { transform: scale(0.95); }
        
        .gojo-grid { display: flex; gap: 6px; }
        #btn-red { background: #ff0033; box-shadow: 0 0 8px #ff0033; }
        #btn-blue { background: #0044ff; box-shadow: 0 0 8px #0044ff; }
        #btn-wand { background: #4a2c11; border: 1px solid #ffaa00; }

        .sens-box { background: rgba(0,0,0,0.85); padding: 6px; border-radius: 6px; display: flex; flex-direction: column; color: white; font-size: 10px; gap: 3px; pointer-events: auto; }

        /* MENÚ DE SELECCIÓN DE HECHIZOS (WoW) */
        #wow-menu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 320px; background: rgb(10, 6, 20); border: 3px solid #ffaa00; border-radius: 12px; padding: 15px; display: none; flex-direction: column; gap: 12px; z-index: 99999; pointer-events: auto; color: white; text-align: center; box-shadow: 0 0 35px rgba(0,0,0,0.9); }
        .wow-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-wow { background: #1a1a1a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .btn-wow.selected { background: #ffaa00; color: black; box-shadow: 0 0 10px #ffaa00; border-color: #fff; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="install-bar">
        <button id="btn-pwa-install">📥 INSTALAR JUEGO</button>
    </div>

    <div id="wow-menu">
        <h3 style="margin: 0; font-size: 16px; color: #ffaa00;">Sintonizador de Varita WoW</h3>
        <p style="margin: 0; font-size: 11px; color: #ccc;">Sintoniza tus catalizadores mágicos elementales</p>
        <div class="wow-options">
            <button class="btn-wow" onclick="selectWoWSpell('Fuego')">🔥 Fuego</button>
            <button class="btn-wow" onclick="selectWoWSpell('Rayo')">⚡ Rayo</button>
            <button class="btn-wow" onclick="selectWoWSpell('Escarcha')">❄️ Escarcha</button>
            <button class="btn-wow" onclick="selectWoWSpell('Arena')">⏳ Arena</button>
        </div>
        <button class="btn-game" style="background: #ffaa00; color: black; width: 100%; margin-top: 5px;" onclick="confirmWoWSpells()">VINCULAR CIRCUITO</button>
    </div>

    <div id="html-ui">
        <div class="top-hud">
            <div class="hud-status" id="net-status">🌐 Online</div>
            <div class="hud-card" id="player-hp">INTEGRIDAD: 100%</div>
            <div class="hud-card" id="combo-status" style="border-color:#ffaa00;">SISTEMA: LISTO</div>
            <div class="hud-saves">Hechizos Guardados: <span id="save-count">3/3</span></div>
        </div>
        
        <div class="top-hud" style="justify-content: flex-start; padding-left: 12px; flex-direction: column; gap: 8px;">
            <div class="sens-box">
                <span>SENSIBILIDAD CÁMARA</span>
                <input type="range" id="sens-slider" min="0.05" max="0.6" step="0.02" value="0.22">
            </div>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="joystick-container" id="joystick-boundary">
            <div id="joystick-knob"></div>
        </div>
        
        <div class="action-container">
            <button class="btn-game" id="btn-slow" style="background:#0088cc;" onclick="triggerTimeSlow()">Ralentizar (5s)</button>
            <div class="gojo-grid">
                <button class="btn-game" id="btn-red" onmousedown="startRedCharge()" onmouseup="endRedCharge()" ontouchstart="startRedCharge()" ontouchend="endRedCharge()">🔴 Rojo</button>
                <button class="btn-game" id="btn-blue" onclick="triggerBlueSpell()">🔵 Azul</button>
            </div>
            <button class="btn-game" id="btn-wand" onclick="openWandMenu()">Cintura Varita</button>
            <div id="wow-cast-buttons" class="gojo-grid hidden"></div>
        </div>
    </div>

    <a-scene fog="type: exponential; color: #070a14; density: 0.03" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        
        <a-entity id="rig" position="0 0 0">
            <a-camera id="camera" look-controls="enabled: true" wasd-controls="acceleration: 45">
                <a-entity geometry="primitive: ring; radiusInner: 0.002; radiusOuter: 0.0035" material="color: #ffaa00; shader: flat" position="0 0 -1"></a-entity>
                <a-entity id="hand-anchor" position="0.3 -0.35 -0.8"></a-entity>
            </a-camera>
            
            <a-entity oculus-touch-controls="hand: left" id="leftHandVR"></a-entity>
            <a-entity oculus-touch-controls="hand: right" id="rightHandVR" laser-controls="hand: right" raycaster="objects: .clickable; far: 30; interval: 50" material="color: #00ffff"></a-entity>
        </a-entity>

        <a-entity id="main-menu" position="0 1.6 -3" rotation="0 0 0" visible="false">
            <a-sky color="#020104"></a-sky>

            <a-entity position="-2.8 0 0.5" rotation="0 30 0">
                <a-plane width="2.2" height="2.5" material="color: #0d1117; opacity: 0.95; side: double">
                    <a-text value="CHARACTER SKIN" align="center" position="0 1.0 0.01" width="4.5" color="#ffaa00"></a-text>
                    <a-plane class="clickable" width="1.8" height="1.6" position="0 -0.1 0.02" material="color: #161b22" onclick="playLaserSound(600, 0.1); alert('Skin Premium de Maniquí Equipada')">
                        <a-text value="UNIQUE CHARACTER SKINS\n\nLIMITED TIME OFFER\nNOW $4.99" align="center" position="0 0 0.02" width="3.5" color="#ffffff"></a-text>
                    </a-plane>
                </a-plane>
            </a-entity>

            <a-entity position="0 0 0">
                <a-plane width="3.2" height="2.5" material="color: #0d1117; opacity: 0.95; side: double">
                    <a-text value="PREMIUM UPGRADE" align="center" position="0 1.0 0.01" width="5" color="#00ffff"></a-text>
                    
                    <a-entity class="clickable" geometry="primitive: box; width: 2.8; height: 0.4; depth: 0.05" material="color: #ffaa00" position="0 0.4 0.03" onclick="playLaserSound(500, 0.15); loadSelectedMap('tutorial')">
                        <a-text value="VOLVER A TUTORIAL AUTOMATICO" align="center" position="0 0 0.03" width="4" color="#000000"></a-text>
                    </a-entity>

                    <a-entity class="clickable" geometry="primitive: box; width: 2.8; height: 0.5; depth: 0.05" material="color: #21262d" position="0 -0.2 0.03" onclick="playLaserSound(500, 0.15); loadSelectedMap('additional')">
                        <a-text value="8 ADDITIONAL MAPS\nTest your skills in Premium game modes\nNOW $4.99" align="center" position="0 0 0.03" width="3.5" color="#ffffff"></a-text>
                    </a-entity>

                    <a-entity class="clickable" geometry="primitive: box; width: 1.3; height: 0.4; depth: 0.05" material="color: #161b22" position="-0.75 -0.8 0.03" onclick="playLaserSound(450, 0.1); loadSelectedMap('rotating')">
                        <a-text value="ROTATING GAMES" align="center" position="0 0 0.03" width="3" color="#ffffff"></a-text>
                    </a-entity>
                    <a-entity class="clickable" geometry="primitive: box; width: 1.3; height: 0.4; depth: 0.05" material="color: #161b22" position="0.75 -0.8 0.03" onclick="playLaserSound(450, 0.1); loadSelectedMap('custom')">
                        <a-text value="CUSTOM GAMES" align="center" position="0 0 0.03" width="3" color="#ffffff"></a-text>
                    </a-entity>
                </a-plane>
            </a-entity>

            <a-entity position="2.8 0 0.5" rotation="0 -30 0">
                <a-plane width="2.2" height="2.5" material="color: #0d1117; opacity: 0.95; side: double">
                    <a-text value="SOCIAL ROOM" align="center" position="0 1.0 0.01" width="4.5" color="#00ffff"></a-text>
                    <a-plane class="clickable" width="1.8" height="1.6" position="0 -0.1 0.02" material="color: #10141b" onclick="playLaserSound(500, 0.15); loadSelectedMap('social')">
                        <a-text value="SOCIAL LOBBY\n\nKING OF THE CROWN\n\nConéctate con otros Hechiceros" align="center" position="0 0 0.02" width="3.2" color="#ffffff"></a-text>
                    </a-plane>
                </a-plane>
            </a-entity>
        </a-entity>

        <a-entity id="game-world" visible="true">
            <a-sky color="#03060f"></a-sky>
            <a-grid material="color: #090e1a; repeat: 40 40; roughness: 0.3"></a-grid>
            <a-light type="ambient" color="#334466"></a-light>
            <a-light type="directional" intensity="1.2" position="2 5 3" color="#99ccff"></a-light>

            <a-ring radius-inner="1.4" radius-outer="1.5" color="#00ffaa" rotation="-90 0 0" position="0 0.02 0" material="shader: flat; side: double"></a-ring>

            <a-entity id="map-structures"></a-entity>
            <a-entity id="active-spells-container"></a-entity>

            <a-text id="tutorial-text" value="Mapa: Estacion Ecos Cosmicos\nUsa los contenedores y pilares para cubrirte." align="center" position="0 2.5 -5" width="4.5" color="#ffffff"></a-text>
            
            <a-entity id="portal-to-menu" class="clickable" geometry="primitive: cylinder; radius: 0.8; height: 0.1" material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1.5" position="0 0.05 -8" onclick="playLaserSound(300, 0.3); exitToMainMenu()">
                <a-text value="TIEMPO NORMAL / IR AL MENU" align="center" rotation="-90 0 0" position="0 0.1 0" width="3" color="#fff"></a-text>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        // --- AUDIO ENGINE (Sintetizadores para Replicar y Mejorar el Sonido Láser del Video) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playLaserSound(startFreq, duration) {
            try {
                let osc = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + duration);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) { console.log("Audio Bloqueado por Interacción"); }
        }

        function playExplosionSound() {
            try {
                let osc = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(10, audioCtx.currentTime + 0.5);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) {}
        }

        // --- SISTEMA INTERNO DE VARIABLES Y HECHIZOS ---
        let selectedWoW = [];
        let timeSlowed = false;
        let currentMode = 'tutorial'; 
        let lastBlueClickTime = 0;
        
        let redChargeTimer = null;
        let redChargeDuration = 0;
        let isHoldingRed = false;
        let isHoldingBlueForPurple = false;
        
        // CONTROL DE DISPARO DEL PÚRPURA (Freno para Evitar los 50 Orbes en la Cara)
        let lastPurpleTime = 0;
        const PURPLE_COOLDOWN = 3000; // 3 segundos enteros de recarga forzada

        const rig = document.getElementById('rig');
        const camera = document.getElementById('camera');
        const knob = document.getElementById('joystick-knob');
        const boundary = document.getElementById('joystick-boundary');
        const slider = document.getElementById('sens-slider');
        const handAnchor = document.getElementById('hand-anchor');
        const activeSpells = document.getElementById('active-spells-container');
        const structures = document.getElementById('map-structures');
        
        let moveX = 0, moveZ = 0;
        let isDraggingJoystick = false;
        let rotY = 0; let rotX = 0;
        let isMovingCamera = false;
        let prevTouchX = 0; let prevTouchY = 0;
        let cameraSens = parseFloat(slider ? slider.value : 0.22);

        if(slider) { slider.addEventListener('input', () => { cameraSens = parseFloat(slider.value); }); }

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) document.getElementById('mobile-controls').style.display = 'flex';

        // CONSTRUCTOR DEL ANDROIDE / ENEMY MANNEQUIN EN HD
        function buildMannequinMesh(parentEntity) {
            let wrapper = document.createElement('a-entity');
            let head = document.createElement('a-sphere');
            head.setAttribute('radius', '0.16'); head.setAttribute('color', '#c4c8d0'); head.setAttribute('position', '0 1.75 0');
            head.setAttribute('material', 'metalness:0.9; roughness:0.1');

            let visor = document.createElement('a-box');
            visor.setAttribute('width', '0.24'); visor.setAttribute('height', '0.04'); visor.setAttribute('depth', '0.08');
            visor.setAttribute('position', '0 1.76 -0.12'); visor.setAttribute('material', 'color:#00ffff; shader: flat');

            let chest = document.createElement('a-box');
            chest.setAttribute('width', '0.46'); chest.setAttribute('height', '0.66'); chest.setAttribute('depth', '0.22');
            chest.setAttribute('position', '0 1.2 0'); chest.setAttribute('material', 'color:#7a818e; metalness:0.8; roughness:0.2');

            let stand = document.createElement('a-cylinder');
            stand.setAttribute('radius', '0.06'); stand.setAttribute('height', '0.86'); stand.setAttribute('position', '0 0.43 0');
            stand.setAttribute('material', 'color:#111215; metalness:0.9');

            wrapper.appendChild(head); wrapper.appendChild(visor); wrapper.appendChild(chest); wrapper.appendChild(stand);
            parentEntity.appendChild(wrapper);
        }

        window.addEventListener('load', () => { loadSelectedMap('tutorial'); });

        function exitToMainMenu() {
            currentMode = 'menu';
            document.getElementById('game-world').setAttribute('visible', 'false');
            document.getElementById('main-menu').setAttribute('visible', 'true');
            rig.setAttribute('position', '0 0 0');
            camera.setAttribute('rotation', '0 0 0');
        }

        function loadSelectedMap(mode) {
            currentMode = mode;
            document.getElementById('main-menu').setAttribute('visible', 'false');
            document.getElementById('game-world').setAttribute('visible', 'true');
            structures.innerHTML = ''; 

            // Generación de Bloques de Cobertura Exactos del Video de Oculus
            createWall(structures, "-2.5 1.5 -5.5", "1.6 3 1.6", "#11161d");
            createWall(structures, "2.5 1.5 -7.5", "1.2 3 1.2", "#11161d");
            createWall(structures, "0 2 -11", "5 4 0.8", "#080b11");

            if (mode === 'tutorial') {
                document.getElementById('tutorial-text').setAttribute('value', "Mapa: Estacion Ecos Cosmicos\nUsa los contenedores y pilares para cubrirte.");
                const dummy = document.createElement('a-entity');
                dummy.setAttribute('position', "0 0 -4.5");
                buildMannequinMesh(dummy);
                structures.appendChild(dummy);
            } else if (mode === 'additional') {
                document.getElementById('tutorial-text').setAttribute('value', "Área Expandida: 8 Additional Maps Activado.");
                for(let i=0; i<6; i++) {
                    const enemyEntity = document.createElement('a-entity');
                    enemyEntity.setAttribute('position', `${(Math.random() * 8) - 4} 0 -${6 + (i * 3)}`);
                    buildMannequinMesh(enemyEntity);
                    structures.appendChild(enemyEntity);
                }
            } else if (mode === 'social') {
                document.getElementById('tutorial-text').setAttribute('value', "Social Lobby (King of the Crown)\nZona de Conexión Segura.");
            } else {
                document.getElementById('tutorial-text').setAttribute('value', `Instancia: ${mode.toUpperCase()}`);
            }
        }

        // ================= CONJURACIÓN EXCLUSIVA DE HECHIZOS =================

        function startRedCharge() {
            if(currentMode === 'menu') return;
            isHoldingRed = true; redChargeDuration = 0;
            document.getElementById('combo-status').innerText = "CARGANDO VECTOR ROJO...";
            
            let chargeSphere = document.createElement('a-sphere');
            chargeSphere.setAttribute('id', 'visual-red-charge');
            chargeSphere.setAttribute('radius', '0.08');
            chargeSphere.setAttribute('color', '#ff0033');
            chargeSphere.setAttribute('material', 'emissive: #ff0033; emissiveIntensity: 2');
            handAnchor.appendChild(chargeSphere);

            redChargeTimer = setInterval(() => {
                redChargeDuration += 100;
                let vRed = document.getElementById('visual-red-charge');
                if(vRed) {
                    let currentRad = parseFloat(vRed.getAttribute('radius'));
                    if(currentRad < 0.22) vRed.setAttribute('radius', currentRad + 0.015);
                }
                
                // Disparador coordinado si se mantiene presionado el alterno
                if (isHoldingRed && isHoldingBlueForPurple) {
                    executePurpleHollow();
                    endRedCharge();
                }
            }, 100);
        }

        function endRedCharge() {
            if(!isHoldingRed) return;
            isHoldingRed = false; clearInterval(redChargeTimer);
            
            let vRed = document.getElementById('visual-red-charge');
            if(vRed) vRed.remove();

            if (redChargeDuration >= 1800) {
                document.getElementById('combo-status').innerText = "¡ROJO: EXPLOSIÓN MÁXIMA!";
                playExplosionSound();
                spawnBlastRing('#ff0033', 3.5, 400);
            } else {
                document.getElementById('combo-status').innerText = "CONJURO: ROJO EMITIDO";
                playLaserSound(800, 0.2);
                spawnMagicSphere('#ff0033', 0.22, 850, 'red-projectile');
            }
        }

        function triggerBlueSpell() {
            if(currentMode === 'menu') return;
            let now = Date.now();
            if (now - lastBlueClickTime < 350) {
                document.getElementById('combo-status').innerText = "¡AZUL MAX: CONVERGENCIA!";
                playLaserSound(300, 0.4);
                spawnStaticVortex('#0044ff', 4.5, 4000);
            } else {
                document.getElementById('combo-status').innerText = "CONJURO: AZUL EMITIDO";
                playLaserSound(900, 0.15);
                spawnMagicSphere('#0044ff', 0.22, 850, 'blue-projectile');
            }
            lastBlueClickTime = now;
        }

        function executePurpleHollow() {
            let ahora = Date.now();
            // Freno absoluto: Si no ha pasado el cooldown, bloquea la ejecución para que no aparezca en tu cara
            if (ahora - lastPurpleTime < PURPLE_COOLDOWN) return;
            
            lastPurpleTime = ahora;
            document.getElementById('combo-status').innerText = "¡TÉCNICA IMAGINARIA: PÚRPURA!";
            isHoldingBlueForPurple = false;
            
            playExplosionSound();
            // Desplazado hacia adelante en Z (-2.5) para que inicie al frente de la cámara y no dentro de ella
            spawnMagicSphere('#9900ff', 1.4, 400, 'purple-ultimate', -2.5);
        }

        function checkOculusGestoPurple() {
            let leftHand = document.getElementById('leftHandVR');
            let rightHand = document.getElementById('rightHandVR');
            if(!leftHand || !rightHand) return;

            let pLeft = leftHand.getAttribute('position');
            let pRight = rightHand.getAttribute('position');
            if(!pLeft || !pRight) return;

            let dist = Math.sqrt(Math.pow(pLeft.x-pRight.x,2) + Math.pow(pLeft.y-pRight.y,2) + Math.pow(pLeft.z-pRight.z,2));
            // Activación equilibrada por proximidad de mandos Oculus
            if (dist < 0.25) { executePurpleHollow(); }
        }

        setInterval(() => {
            if(currentMode !== 'menu') {
                checkOculusGestoPurple();
                checkVortexCollisions();
            }
        }, 200);

        // MAPEO COMBINADO DE EMISIÓN DE VECTORES
        function spawnMagicSphere(color, radius, speed, className, offsetZ = -1.5) {
            const sphere = document.createElement('a-sphere');
            sphere.setAttribute('class', className);
            sphere.setAttribute('radius', radius);
            sphere.setAttribute('color', color);
            sphere.setAttribute('material', `emissive: ${color}; emissiveIntensity: 1.8; roughness: 0.2`);

            let playerPos = rig.getAttribute('position');
            let currentRot = camera.getAttribute('rotation');
            let angleRad = currentRot.y * (Math.PI / 180);
            let pitchRad = currentRot.x * (Math.PI / 180);

            // Se calcula la posición de salida aplicando el offsetZ para que no colisione con el visor
            let startX = playerPos.x - Math.sin(angleRad) * Math.abs(offsetZ);
            let startY = 1.4 - Math.sin(pitchRad) * Math.abs(offsetZ);
            let startZ = playerPos.z - Math.cos(angleRad) * Math.abs(offsetZ);

            let targetX = playerPos.x - Math.sin(angleRad) * 40;
            let targetY = 1.4 - Math.sin(pitchRad) * 40;
            let targetZ = playerPos.z - Math.cos(angleRad) * 40;

            sphere.setAttribute('position', `${startX} ${startY} ${startZ}`);
            sphere.setAttribute('animation', `property: position; from: ${startX} ${startY} ${startZ}; to: ${targetX} ${targetY} ${targetZ}; dur: ${speed}; easing: linear`);
            activeSpells.appendChild(sphere);

            setTimeout(() => { if(sphere) sphere.remove(); }, speed);
        }

        function spawnStaticVortex(color, radius, duration) {
            const vortex = document.createElement('a-entity');
            vortex.setAttribute('class', 'static-blue-vortex');
            
            let core = document.createElement('a-sphere');
            core.setAttribute('radius', '1.0'); core.setAttribute('color', color);
            core.setAttribute('material', `emissive: ${color}; emissiveIntensity: 2.5; transparent: true; opacity: 0.8`);
            vortex.appendChild(core);

            let playerPos = rig.getAttribute('position');
            let currentRot = camera.getAttribute('rotation');
            let angleRad = currentRot.y * (Math.PI / 180);
            
            let spawnX = playerPos.x - Math.sin(angleRad) * 5.5;
            let spawnZ = playerPos.z - Math.cos(angleRad) * 5.5;
            vortex.setAttribute('position', `${spawnX} 1.4 ${spawnZ}`);

            activeSpells.appendChild(vortex);
            setTimeout(() => { if(vortex) vortex.remove(); }, duration);
        }

        function spawnBlastRing(color, maxRadius, speed) {
            const ring = document.createElement('a-ring');
            ring.setAttribute('radius-inner', '0.1'); ring.setAttribute('radius-outer', '0.2');
            ring.setAttribute('color', color); ring.setAttribute('rotation', '-90 0 0');
            ring.setAttribute('material', 'shader: flat; side: double');
            
            let pos = rig.getAttribute('position');
            ring.setAttribute('position', `${pos.x} 0.2 ${pos.z}`);
            ring.setAttribute('animation', `property: radiusInner; from: 0.1; to: ${maxRadius - 0.2}; dur: ${speed}; easing: easeOutQuad`);
            ring.setAttribute('animation__outer', `property: radiusOuter; from: 0.2; to: ${maxRadius}; dur: ${speed}; easing: easeOutQuad`);
            
            activeSpells.appendChild(ring);
            setTimeout(() => { ring.remove(); }, speed);
        }

        function checkVortexCollisions() {
            let vortexes = document.querySelectorAll('.static-blue-vortex');
            let projectiles = document.querySelectorAll('.red-projectile');

            vortexes.forEach(vortex => {
                let vPos = vortex.getAttribute('position');
                projectiles.forEach(proj => {
                    let pPos = proj.getAttribute('position');
                    if(!vPos || !pPos) return;

                    let dist = Math.sqrt(Math.pow(vPos.x-pPos.x,2)+Math.pow(vPos.y-pPos.y,2)+Math.pow(vPos.z-pPos.z,2));
                    if(dist < 1.6) {
                        proj.remove(); vortex.remove();
                        document.getElementById('combo-status').innerText = "¡COLISIÓN ATÓMICA DE VECTORES!";
                        playExplosionSound();
                        spawnBlastRing('#ffffff', 10, 500);
                    }
                });
            });
        }

        // ================= CONFIGURADOR WAR OF WIZARDS (WoW) =================
        function openWandMenu() { document.getElementById('wow-menu').style.display = 'flex'; }
        
        function selectWoWSpell(name) {
            const idx = selectedWoW.indexOf(name);
            if (idx > -1) selectedWoW.splice(idx, 1);
            else { if (selectedWoW.length >= 3) return; selectedWoW.push(name); }
            
            const buttons = document.querySelectorAll('.btn-wow');
            buttons.forEach(b => {
                let sName = b.innerText.split(' ')[1];
                if(selectedWoW.includes(sName)) b.classList.add('selected');
                else b.classList.remove('selected');
            });
        }

        function confirmWoWSpells() {
            if(selectedWoW.length !== 3) return;
            document.getElementById('wow-menu').style.display = 'none';
            document.getElementById('btn-wand').innerText = "Wand Sintonizada";

            const container = document.getElementById('wow-cast-buttons');
            container.innerHTML = ''; container.classList.remove('hidden');
            
            selectedWoW.forEach(spell => {
                const btn = document.createElement('button');
                btn.className = 'btn-game clickable'; btn.style.background = '#4a2c11';
                btn.innerText = spell;
                
                btn.onclick = () => {
                    if(spell === 'Fuego') { playLaserSound(650, 0.2); spawnMagicSphere('#ff6600', 0.25, 750, 'wow-fire'); }
                    if(spell === 'Rayo') { playLaserSound(950, 0.1); spawnMagicSphere('#ffff00', 0.10, 350, 'wow-bolt'); }
                    if(spell === 'Escarcha') { playLaserSound(550, 0.25); spawnMagicSphere('#00ffff', 0.20, 1000, 'wow-frost'); }
                    if(spell === 'Arena') { playLaserSound(400, 0.3); spawnMagicSphere('#c2b280', 0.35, 1200, 'wow-sand'); }
                };
                container.appendChild(btn);
            });
        }

        // CONTROL JOYSTICK MÓVIL
        if(isMobile) {
            boundary.addEventListener('touchstart', (e) => { e.stopPropagation(); isDraggingJoystick = true; updateJoystick(e.touches[0]); });
            window.addEventListener('touchmove', (e) => { if (isDraggingJoystick) { e.stopPropagation(); updateJoystick(e.touches[0]); } });
            window.addEventListener('touchend', () => {
                isDraggingJoystick = false; knob.style.top = '32px'; knob.style.left = '32px';
                moveX = 0; moveZ = 0;
            });
        }

        function updateJoystick(touch) {
            const rect = boundary.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let deltaX = touch.clientX - centerX; let deltaY = touch.clientY - centerY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 32;

            if (distance > maxRadius) { deltaX = (deltaX / distance) * maxRadius; deltaY = (deltaY / distance) * maxRadius; }
            knob.style.left = `${32 + deltaX}px`; knob.style.top = `${32 + deltaY}px`;
            moveX = deltaX / maxRadius; moveZ = deltaY / maxRadius;
        }

        setInterval(() => {
            if ((moveX !== 0 || moveZ !== 0) && currentMode !== 'menu' && isMobile) {
                let speed = timeSlowed ? 0.03 : 0.095;
                const angle = rotY * (Math.PI / 180);
                let forwardX = Math.sin(angle) * moveZ; let forwardZ = Math.cos(angle) * moveZ;
                let sideX = Math.cos(angle) * moveX; let sideZ = -Math.sin(angle) * moveX;

                let currentPos = rig.getAttribute('position');
                currentPos.x += (forwardX - sideX) * speed; currentPos.z += (forwardZ + sideZ) * speed;
                rig.setAttribute('position', currentPos);
            }
        }, 20);

        window.addEventListener('touchstart', (e) => {
            if (!isMobile) return;
            if (e.touches[0].clientX > window.innerWidth / 2 || currentMode === 'menu') { isMovingCamera = true; prevTouchX = e.touches[0].clientX; prevTouchY = e.touches[0].clientY; }
        });
        window.addEventListener('touchmove', (e) => {
            if (isMovingCamera && isMobile) {
                let touch = e.touches[0];
                let diffX = touch.clientX - prevTouchX; let diffY = touch.clientY - prevTouchY;
                rotY -= diffX * cameraSens; rotX -= diffY * cameraSens;
                rotX = Math.max(-70, Math.min(70, rotX));
                camera.setAttribute('rotation', `${rotX} ${rotY} 0`);
                prevTouchX = touch.clientX; prevTouchY = touch.clientY;
            }
        });
        window.addEventListener('touchend', () => { isMovingCamera = false; });

        function createWall(parent, pos, size, color) {
            const w = document.createElement('a-box');
            w.setAttribute('position', pos);
            w.setAttribute('geometry', `width: ${size.split(' ')[0]}; height: ${size.split(' ')[1]}; depth: ${size.split(' ')[2]}`);
            w.setAttribute('material', `color: ${color}; roughness: 0.4; metalness: 0.4`);
            parent.appendChild(w);
        }

        function triggerTimeSlow() { if (!timeSlowed) { timeSlowed = true; setTimeout(() => { timeSlowed = false; }, 5000); } }

        window.addEventListener('keydown', (e) => {
            let key = e.key.toLowerCase();
            if(key === 'e' && !isHoldingRed) startRedCharge();
            if(key === 'r') { isHoldingBlueForPurple = true; triggerBlueSpell(); }
        });
        window.addEventListener('keyup', (e) => {
            let key = e.key.toLowerCase();
            if(key === 'e') endRedCharge();
            if(key === 'r') isHoldingBlueForPurple = false;
        });

        document.getElementById('btn-pwa-install').addEventListener('click', () => {
            alert("SISTEMA DE DESPLIEGUE PWA:\n\n- Oculus VR / PC: Pulsa el icono de la pantalla con una fletcha en tu barra de direcciones.\n- Celular: Despliega el menú del navegador y pulsa 'Instalar aplicación'.");
        });
    </script>
</body>
</html>
