    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; }
        #html-ui { position: absolute; z-index: 100; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .top-hud { display: flex; justify-content: space-between; padding: 15px; pointer-events: auto; }
        .hud-card { background: rgba(0, 0, 0, 0.85); padding: 10px 15px; border-radius: 8px; border: 2px solid #331155; color: white; font-weight: bold; font-size: 14px; }
        
        /* JOYSTICK REAL CONFIGURADO */
        #mobile-controls { position: absolute; bottom: 20px; width: 100%; height: 220px; display: none; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: none; z-index: 150; }
        .joystick-container { width: 130px; height: 130px; background: rgba(255,255,255,0.1); border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; pointer-events: auto; margin-top: 40px; }
        #joystick-knob { width: 55px; height: 55px; background: #ffffff; border-radius: 50%; position: absolute; top: 37px; left: 37px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transform: translate(0,0); }
        
        /* PANEL DE ACCIONES Y COMBATE */
        .action-container { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; align-items: flex-end; }
        .btn-game { padding: 12px; border-radius: 12px; border: none; color: white; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        
        .gojo-grid { display: flex; gap: 6px; }
        #btn-red { background: #ff0033; }
        #btn-blue { background: #0044ff; }
        #btn-purple { background: #9900ff; }
        #btn-wand { background: #8b5a2b; border: 2px solid #ffaa00; width: 110px; }
        #btn-slow { background: #0088cc; width: 140px; }

        /* POPUP SELECCIÓN DE HECHIZOS WAR OF WIZARDS */
        #wow-menu { position: absolute; top: 25%; left: 25%; width: 50%; background: rgba(15, 8, 30, 0.95); border: 3px solid #ffaa00; border-radius: 15px; padding: 20px; display: none; flex-direction: column; gap: 15px; z-index: 200; pointer-events: auto; color: white; text-align: center; }
        .wow-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-wow { background: #222; border: 1px solid #555; color: white; padding: 10px; border-radius: 8px; font-weight: bold; }
        .btn-wow.selected { background: #ffaa00; color: black; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="html-ui">
        <div class="top-hud">
            <div class="hud-card" id="connection-status">🌐 Buscando Red...</div>
            <div class="hud-card" id="player-hp">Vida: 100%</div>
            <div class="hud-card" id="spell-slots">Ranuras WoW: 0/3</div>
        </div>
        <div class="top-hud" style="justify-content: center;">
            <div class="hud-card" id="time-slow-indicator">Tiempo Normal</div>
        </div>
    </div>

    <div id="wow-menu">
        <h3>Selecciona 3 Hechizos de War of Wizards</h3>
        <div class="wow-options">
            <button class="btn-wow" onclick="selectWoWSpell('Bola de Fuego')">🔥 Bola de Fuego</button>
            <button class="btn-wow" onclick="selectWoWSpell('Rayo Relámpago')">⚡ Rayo Relámpago</button>
            <button class="btn-wow" onclick="selectWoWSpell('Escudo Escarcha')">❄️ Escudo Escarcha</button>
            <button class="btn-wow" onclick="selectWoWSpell('Tormenta Arena')">⏳ Tormenta Arena</button>
        </div>
        <button class="btn-game" style="background: green; width: 100%; margin-top: 10px;" onclick="confirmWoWSpells()">Confirmar Hechizos</button>
    </div>

    <div id="mobile-controls">
        <div class="joystick-container" id="joystick-boundary">
            <div id="joystick-knob"></div>
        </div>
        
        <div class="action-container">
            <button class="btn-game" id="btn-slow" onclick="triggerTimeSlow()">Ralentizar (5s)</button>
            
            <div class="gojo-grid">
                <button class="btn-game" id="btn-red" onclick="castGojo('Rojo', '#ff0033')">Rojo</button>
                <button class="btn-game" id="btn-blue" onclick="castGojo('Azul', '#0044ff')">Azul</button>
                <button class="btn-game" id="btn-purple" onclick="castGojo('Púrpura', '#9900ff')">Púrpura</button>
            </div>
            
            <button class="btn-game" id="btn-wand" onclick="openWandMenu()">Sacar Varita</button>
            <div id="wow-cast-buttons" class="gojo-grid hidden">
                </div>
        </div>
    </div>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        <a-assets>
            <canvas id="space-bg" width="256" height="256"></canvas>
        </a-assets>

        <a-entity id="rig" position="0 0 0">
            <a-camera id="camera" look-controls="touchEnabled: true" wasd-controls="acceleration: 30">
                <a-entity geometry="primitive: ring; radiusInner: 0.002; radiusOuter: 0.004" material="color: #fff; shader: flat" position="0 0 -1"></a-entity>
            </a-camera>
            <a-entity oculus-touch-controls="hand: left"></a-entity>
            <a-entity id="right-hand" oculus-touch-controls="hand: right" listener-grip></a-entity>
        </a-entity>

        <a-entity id="main-menu">
            <a-sky id="menu-sky" color="#03020a"></a-sky>
            <a-entity id="ton618-sphere" geometry="primitive: sphere; radius: 12" material="color: #000; emissive: #15002b" position="0 15 -35" visible="false"></a-entity>

            <a-text value="WAR OF MANNEQUINS" align="center" position="0 3.6 -4" width="9" color="#fff"></a-text>
            <a-text id="network-3d" value="MODO: ONLINE" align="center" position="0 3.1 -4" width="4" color="#00ffcc"></a-text>

            <a-entity id="btn-mode1" class="clickable" geometry="primitive: box; width: 2.2; height: 0.5; depth: 0.1" material="color: #121225" position="-1.3 2.1 -3" onclick="loadMap('evasion')">
                <a-text value="Modo Evasión" align="center" position="0 0 0.06" width="4.5"></a-text>
            </a-entity>

            <a-entity id="btn-mode2" class="clickable" geometry="primitive: box; width: 2.2; height: 0.5; depth: 0.1" material="color: #121225" position="1.3 2.1 -3" onclick="loadMap('entorno')">
                <a-text value="Modo Entorno" align="center" position="0 0 0.06" width="4.5"></a-text>
            </a-entity>

            <a-entity id="btn-solitario" class="clickable" geometry="primitive: box; width: 2.2; height: 0.5; depth: 0.1" material="color: #0a2f1d" position="-1.3 1.3 -3" onclick="loadMap('solitario')">
                <a-text value="Solitario Local" align="center" position="0 0 0.06" width="4.5"></a-text>
            </a-entity>

            <a-entity id="btn-online" class="clickable" geometry="primitive: box; width: 2.2; height: 0.5; depth: 0.1" material="color: #0f1c3f" position="1.3 1.3 -3" onclick="checkOnlineStructure()">
                <a-text id="txt-online" value="Buscar Partida" align="center" position="0 0 0.06" width="4.5"></a-text>
            </a-entity>

            <a-entity id="btn-bossfight" class="clickable hidden" geometry="primitive: box; width: 3.2; height: 0.6; depth: 0.1" material="color: #660011" position="0 0.4 -3" onclick="loadMap('bossfight')">
                <a-text value="BOSS FIGHT" align="center" position="0 0 0.06" width="5" color="#fff"></a-text>
            </a-entity>

            <a-entity id="btn-instalar" class="clickable hidden" geometry="primitive: box; width: 2; height: 0.5; depth: 0.1" material="color: #ffaa00" position="0 1.5 2.5" rotation="0 180 0">
                <a-text value="INSTALAR JUEGO" align="center" position="0 0 0.06" width="4" color="#000"></a-text>
            </a-entity>
        </a-entity>

        <a-entity id="game-world" visible="false">
            <a-sky color="#010003"></a-sky>
            <a-grid material="color: #151619; metalness: 0.7; roughness: 0.3"></a-grid>
            <a-light type="ambient" color="#1a1a26"></a-light>
            <a-light id="flashlight" type="spot" color="#fff" intensity="1.5" position="0 2 0" angle="28"></a-light>

            <a-entity id="map-structures"></a-entity>

            <a-entity id="boss-container" position="0 4 -22" visible="false">
                <a-sphere id="boss-core" radius="3" material="color: #000; roughness: 1"></a-sphere>
                <a-ring id="boss-eye" radius-inner="1.5" radius-outer="2.2" material="color: #ff0055; side: double"></a-ring>
            </a-entity>

            <a-text id="game-prompt" value="" align="center" position="0 3.5 -6" width="5.5"></a-text>
        </a-entity>
    </a-scene>

    <script>
        let spellsLeft = 3;
        let selectedWoW = [];
        let timeSlowed = false;
        let isOnline = navigator.onLine;
        let currentMode = 'menu';
        let playerHP = 100;
        let eyeOpen = false;

        // Joystick Data y Variables de Movimiento
        const rig = document.getElementById('rig');
        const knob = document.getElementById('joystick-knob');
        const boundary = document.getElementById('joystick-boundary');
        let moveX = 0, moveZ = 0;
        let isDraggingJoystick = false;

        // Detectar Pantalla Táctil Celular
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) document.getElementById('mobile-controls').style.display = 'flex';

        // PROGRAMACIÓN MATEMÁTICA DEL JOYSTICK DE MOVIMIENTO TÁCTIL
        boundary.addEventListener('touchstart', (e) => { isDraggingJoystick = true; updateJoystick(e.touches[0]); });
        window.addEventListener('touchmove', (e) => { if (isDraggingJoystick) updateJoystick(e.touches[0]); });
        window.addEventListener('touchend', () => {
            isDraggingJoystick = false;
            knob.style.transform = `translate(0px, 0px)`;
            moveX = 0; moveZ = 0;
        });

        function updateJoystick(touch) {
            const rect = boundary.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 37;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            knob.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            // Asignar velocidades de traslación
            moveX = deltaX / maxRadius;
            moveZ = deltaY / maxRadius;
        }

        // Bucle de física manual para mover el Rig en base al Joystick
        setInterval(() => {
            if ((moveX !== 0 || moveZ !== 0) && currentMode !== 'menu') {
                let speed = timeSlowed ? 0.04 : 0.12;
                // Obtener dirección actual de la cámara
                const cameraRotation = document.getElementById('camera').getAttribute('rotation');
                const angle = cameraRotation.y * (Math.PI / 180);
                
                // Mover relativo hacia donde mira la cámara
                let forwardX = Math.sin(angle) * moveZ;
                let forwardZ = Math.cos(angle) * moveZ;
                let sideX = Math.cos(angle) * moveX;
                let sideZ = -Math.sin(angle) * moveX;

                let currentPos = rig.getAttribute('position');
                currentPos.x -= (forwardX + sideX) * speed;
                currentPos.z -= (forwardZ + sideZ) * speed;
                rig.setAttribute('position', currentPos);
            }
        }, 20);

        // CONFIGURACIÓN DE WAR OF WIZARDS (SISTEMA DE SELECCIÓN DE 3 HECHIZOS)
        function openWandMenu() {
            document.getElementById('wow-menu').style.display = 'flex';
        }

        function selectWoWSpell(name) {
            const idx = selectedWoW.indexOf(name);
            if (idx > -1) {
                selectedWoW.splice(idx, 1);
            } else {
                if (selectedWoW.length >= 3) return alert("Solo puedes equipar 3 hechizos en tu varita.");
                selectedWoW.push(name);
            }
            // Actualizar interfaz visual de selección
            const buttons = document.querySelectorAll('.btn-wow');
            buttons.forEach(b => {
                if(selectedWoW.some(s => b.innerText.includes(s))) b.classList.add('selected');
                else b.classList.remove('selected');
            });
        }

        function confirmWoWSpells() {
            if(selectedWoW.length !== 3) return alert("Por favor elige exactamente 3 hechizos.");
            document.getElementById('wow-menu').style.display = 'none';
            document.getElementById('btn-wand').innerText = "Varita Lista";
            document.getElementById('btn-wand').style.background = "#228b22";
            document.getElementById('spell-slots').innerText = `Ranuras WoW: 3/3`;

            // Construir botones táctiles para lanzar los Hechizos Seleccionados de WoW
            const container = document.getElementById('wow-cast-buttons');
            container.innerHTML = '';
            container.classList.remove('hidden');
            selectedWoW.forEach(spell => {
                const btn = document.createElement('button');
                btn.className = 'btn-game';
                btn.style.background = '#8b5a2b';
                btn.innerText = spell;
                btn.onclick = () => castWoW(spell);
                container.appendChild(btn);
            });
        }

        function castWoW(spellName) {
            spawnMagicSphere('#ffaa00', 0.3, 1400);
            document.getElementById('game-prompt').setAttribute('value', `Varita WoW lanzó: ${spellName}`);
        }

        // TÉCNICAS ADICIONALES DE GOJO SATORU (SEPARADAS)
        function castGojo(type, color) {
            let radius = type === 'Púrpura' ? 0.7 : 0.3;
            let duration = type === 'Púrpura' ? 700 : 1300;
            spawnMagicSphere(color, radius, duration);
            document.getElementById('game-prompt').setAttribute('value', `Técnica Gojo ejecutada: ${type}`);
        }

        function spawnMagicSphere(color, radius, speed) {
            const sphere = document.createElement('a-sphere');
            sphere.setAttribute('radius', radius);
            sphere.setAttribute('color', color);
            sphere.setAttribute('material', 'emissive', color);
            sphere.setAttribute('position', '0 1.2 -1.5');
            sphere.setAttribute('animation', `property: position; to: 0 1.2 -30; dur: ${speed}; easing: linear`);
            document.getElementById('game-world').appendChild(sphere);
        }

        // CARGA E INSTANCIACIÓN DE MAPAS REALES (ESTILO MANNEQUIN)
        function loadMap(mode) {
            currentMode = mode;
            document.getElementById('main-menu').setAttribute('visible', 'false');
            document.getElementById('game-world').setAttribute('visible', 'true');
            
            const container = document.getElementById('map-structures');
            container.innerHTML = ''; // Limpiar mapa viejo

            // Crear Muros y Coberturas idénticos al juego Mannequin
            createWall(container, "0 2.5 -15", "14 5 0.5", "#2e3138"); 
            createWall(container, "-7 2.5 -8", "0.5 5 14", "#2e3138");
            createWall(container, "7 2.5 -8", "0.5 5 14", "#2e3138");
            
            // Columnas tácticas para esconderse
            createWall(container, "-3 2.5 -6", "1.5 5 1.5", "#424651", "clickable");
            createWall(container, "3 2.5 -10", "2 5 2", "#424651", "clickable");
            createWall(container, "-4 2.5 -12", "1.5 5 1.5", "#424651", "clickable");

            if(mode === 'bossfight') {
                document.getElementById('boss-container').setAttribute('visible', 'true');
                document.getElementById('game-prompt').setAttribute('value', "⚠️ BOSS FIGHT TON 618 ⚠️\n¡Escóndete tras los bloques cuando el ojo brille!");
                startBossLogic();
            } else {
                document.getElementById('game-prompt').setAttribute('value', `Modo: ${mode.toUpperCase()}\nLos Mannequins se ocultan en las sombras.`);
                spawnMannequins(container);
            }
        }

        function createWall(parent, pos, size, color, className="") {
            const w = document.createElement('a-box');
            w.setAttribute('position', pos);
            w.setAttribute('geometry', `width: ${size.split(' ')[0]}; height: ${size.split(' ')[1]}; depth: ${size.split(' ')[2]}`);
            w.setAttribute('material', `color: ${color}; metalness: 0.5; roughness: 0.4`);
            if(className) w.className = className;
            parent.appendChild(w);
        }

        // SPAWN DE MANNEQUINS CON INTELIGENCIA ARTIFICIAL (SE QUEDAN RÍGIDOS SI LOS MIRAS)
        function spawnMannequins(parent) {
            for(let i=0; i<3; i++) {
                const m = document.createElement('a-box');
                m.setAttribute('position', `${(Math.random() * 8) - 4} 0.9 -${10 + (i*3)}`);
                m.setAttribute('geometry', 'width: 0.5; height: 1.8; depth: 0.4');
                m.setAttribute('material', 'color: #8c8c8c; roughness: 0.8');
                parent.appendChild(m);
            }
        }

        // LÓGICA DE DAÑO Y COMPORTAMIENTO DEL OJO EN LA BOSS FIGHT
        function startBossLogic() {
            const eye = document.getElementById('boss-eye');
            
            setInterval(() => {
                if (currentMode !== 'bossfight') return;
                
                eyeOpen = !eyeOpen;
                if(eyeOpen) {
                    eye.setAttribute('material', 'color', '#ff0033'); // Ojo abierto y enfocado
                    document.getElementById('game-prompt').setAttribute('value', "👁️ ¡EL OJO TE ESTÁ BUSCANDO! ¡OCÚLTATE!");
                    
                    // Validar si el jugador está a cubierto o expuesto
                    setTimeout(() => {
                        if(eyeOpen && currentMode === 'bossfight') {
                            // Si el jugador está muy al centro o desprotegido (Física simplificada basada en posición X respecto a pilares)
                            const playerX = rig.getAttribute('position').x;
                            if (Math.abs(playerX) < 1.8) { 
                                playerHP -= 25;
                                document.getElementById('player-hp').innerText = `Vida: ${playerHP}%`;
                                document.getElementById('player-hp').style.borderColor = "red";
                                if(playerHP <= 0) {
                                    alert("Has sido desintegrado por la mirada gravitacional de TON 618.");
                                    location.reload();
                                }
                            }
                        }
                    }, 1200);

                } else {
                    eye.setAttribute('material', 'color', '#33000a'); // Ojo cerrado / Carga de energía
                    document.getElementById('game-prompt').setAttribute('value', "🔮 El ojo está recargando. ¡Ataca ahora!");
                }
            }, 3500);
        }

        // MECÁNICA DE RALENTIZACIÓN TEMPORAL
        function triggerTimeSlow() {
            if (!timeSlowed) {
                timeSlowed = true;
                document.getElementById('time-slow-indicator').innerText = "⏱️ TIEMPO LENTO (5s)";
                document.getElementById('time-slow-indicator').style.color = "#00ffcc";
                setTimeout(() => {
                    timeSlowed = false;
                    document.getElementById('time-slow-indicator').innerText = "Tiempo Normal";
                    document.getElementById('time-slow-indicator').style.color = "white";
                }, 5000);
            }
        }

        // PROBABILIDAD DEL MENÚ DE PASCUA TON 618 (1 DE 5)
        window.addEventListener('DOMContentLoaded', () => {
            const dice = Math.floor(Math.random() * 5) + 1;
            if (dice === 5) {
                document.getElementById('menu-sky').setAttribute('color', '#0e021a');
                document.getElementById('ton618-sphere').setAttribute('visible', 'true');
                // Revela el botón Boss fight condicionado
                document.getElementById('btn-bossfight').classList.remove('hidden');
            }
            
            // Estado de Red
            isOnline = navigator.onLine;
            document.getElementById('connection-status').innerText = isOnline ? "🌐 Online" : "⚠️ Offline";
        });
        
        function checkOnlineStructure() { alert(isOnline ? "Buscando servidores multijugador activos..." : "No tienes conexión."); }
    </script>
</body>
</html>
