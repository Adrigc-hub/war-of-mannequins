<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>War of Mannequins</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; touch-action: none; }
        #html-ui { position: absolute; z-index: 100; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .top-hud { display: flex; justify-content: space-between; padding: 12px; pointer-events: auto; }
        .hud-card { background: rgba(0, 0, 0, 0.85); padding: 8px 12px; border-radius: 6px; border: 2px solid #331155; color: white; font-weight: bold; font-size: 13px; }
        
        /* JOYSTICK FIJO OPERATIVO */
        #mobile-controls { position: absolute; bottom: 15px; width: 100%; height: 180px; display: none; justify-content: space-between; padding: 0 25px; box-sizing: border-box; pointer-events: none; z-index: 150; }
        .joystick-container { width: 110px; height: 110px; background: rgba(255,255,255,0.15); border: 3px solid rgba(255,255,255,0.4); border-radius: 50%; position: relative; pointer-events: auto; margin-top: 40px; }
        #joystick-knob { width: 45px; height: 45px; background: #ffffff; border-radius: 50%; position: absolute; top: 32px; left: 32px; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        
        /* BOTONERA LATERAL */
        .action-container { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; align-items: flex-end; }
        .btn-game { padding: 10px 14px; border-radius: 10px; border: none; color: white; font-weight: bold; font-size: 12px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        
        .gojo-grid { display: flex; gap: 6px; }
        #btn-red { background: #ff0033; }
        #btn-blue { background: #0044ff; }
        #btn-purple { background: #9900ff; }
        #btn-wand { background: #8b5a2b; border: 1px solid #ffaa00; }
        #btn-slow { background: #0088cc; }

        /* SELECCIÓN WAR OF WIZARDS */
        #wow-menu { position: absolute; top: 15%; left: 15%; width: 70%; background: rgb(15, 8, 30); border: 3px solid #ffaa00; border-radius: 12px; padding: 15px; display: none; flex-direction: column; gap: 10px; z-index: 300; pointer-events: auto; color: white; text-align: center; box-sizing: border-box; }
        .wow-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-wow { background: #222; border: 1px solid #555; color: white; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        .btn-wow.selected { background: #ffaa00; color: black; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="html-ui">
        <div class="top-hud">
            <div class="hud-card" id="connection-status">Detectando Red...</div>
            <div class="hud-card" id="player-hp">Vida: 100%</div>
            <div class="hud-card" id="spell-slots">Hechizos WoW: 0/3</div>
        </div>
        <div class="top-hud" style="justify-content: center;">
            <div class="hud-card" id="time-slow-indicator">Tiempo Normal</div>
        </div>
    </div>

    <div id="wow-menu">
        <h3 style="margin: 5px 0;">Elige 3 Hechizos (War of Wizards)</h3>
        <div class="wow-options">
            <button class="btn-wow" onclick="selectWoWSpell('Bola de Fuego')">🔥 Fuego</button>
            <button class="btn-wow" onclick="selectWoWSpell('Rayo Relámpago')">⚡ Rayo</button>
            <button class="btn-wow" onclick="selectWoWSpell('Escudo Escarcha')">❄️ Escarcha</button>
            <button class="btn-wow" onclick="selectWoWSpell('Tormenta Arena')">⏳ Arena</button>
        </div>
        <button class="btn-game" style="background: green; width: 100%;" onclick="confirmWoWSpells()">Equipar en Varita</button>
    </div>

    <div id="mobile-controls">
        <div class="joystick-container" id="joystick-boundary">
            <div id="joystick-knob"></div>
        </div>
        
        <div class="action-container">
            <button class="btn-game" id="btn-slow" onclick="triggerTimeSlow()">Ralentizar (5s)</button>
            <div class="gojo-grid">
                <button class="btn-game" id="btn-red" onclick="castGojo('Rojo', '#ff0033')">Rojo</button>
                <button class="btn-game" id="btn-blue" onclick="castGojo('Azul', '#0044ff')">Azul</button>
                <button class="btn-game" id="btn-purple" onclick="castGojo('Púrpura', '#9900ff')">Púrpura</button>
            </div>
            <button class="btn-game" id="btn-wand" onclick="openWandMenu()">Sacar Varita</button>
            <div id="wow-cast-buttons" class="gojo-grid hidden"></div>
        </div>
    </div>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        <a-assets>
            <canvas id="space-bg" width="256" height="256"></canvas>
        </a-assets>

        <a-entity id="rig" position="0 0 0">
            <a-camera id="camera" look-controls="magicWindowTrackingEnabled: false; touchEnabled: true" wasd-controls="acceleration: 30">
                <a-entity geometry="primitive: ring; radiusInner: 0.002; radiusOuter: 0.004" material="color: #fff; shader: flat" position="0 0 -1"></a-entity>
            </a-camera>
            <a-entity oculus-touch-controls="hand: left"></a-entity>
            <a-entity id="right-hand" oculus-touch-controls="hand: right"></a-entity>
        </a-entity>

        <a-entity id="main-menu">
            <a-sky id="menu-sky" color="#03020a"></a-sky>
            <a-entity id="ton618-sphere" geometry="primitive: sphere; radius: 12" material="color: #000; emissive: #15002b" position="0 15 -35" visible="false"></a-entity>

            <a-text value="MANNEQUIN (MENU MODIFICADO)" align="center" position="0 3.6 -4" width="9" color="#fff"></a-text>
            <a-text id="network-3d" value="MODO: ONLINE" align="center" position="0 3.1 -4" width="4" color="#00ffcc"></a-text>

            <a-entity id="btn-mode1" class="clickable" geometry="primitive: box; width: 2.2; height: 0.5; depth: 0.1" material="color: #121225" position="-1.3 2.1 -3" onclick="loadMap('evasion')">
                <a-text value="Modo Evasión" align="center" position="0 0 0.06" width="4.5"></a-text>
            </a-entity>

            <a-entity id="btn-mode2" class="clickable" geometry="primitive: box; width: 2.2; height: 0.5; depth: 0.1" material="color: #121225" position="1.3 2.1 -3" onclick="loadMap('entorno')">
                <a-text value="Modo Entorno" align="center" position="0 0 0.06" width="4.5"></a-text>
            </a-entity>

            <a-entity id="btn-solitario" class="clickable" geometry="primitive: box; width: 2.2; height: 0.5; depth: 0.1" material="color: #0a2f1d" position="-1.3 1.3 -3" onclick="loadMap('solitario')">
                <a-text value="Solitario Local" align="center" position="0 0 0.06" width="4.5"></a-text>
            </a-entity>

            <a-entity id="btn-online" class="clickable" geometry="primitive: box; width: 2.2; height: 0.5; depth: 0.1" material="color: #0f1c3f" position="1.3 1.3 -3" onclick="alert('Buscando servidores...')">
                <a-text value="Modo Online" align="center" position="0 0 0.06" width="4.5"></a-text>
            </a-entity>

            <a-entity id="btn-bossfight" class="clickable" geometry="primitive: box; width: 3.2; height: 0.6; depth: 0.1" material="color: #660011" position="0 0.4 -3" visible="false" onclick="loadMap('bossfight')">
                <a-text value="BOSS FIGHT" align="center" position="0 0 0.06" width="5" color="#fff"></a-text>
            </a-entity>
        </a-entity>

        <a-entity id="game-world" visible="false">
            <a-sky color="#010003"></a-sky>
            <a-grid material="color: #1b1d22; metalness: 0.6; roughness: 0.4"></a-grid>
            <a-light type="ambient" color="#222233"></a-light>
            <a-light id="flashlight" type="spot" color="#fff" intensity="2" position="0 2.5 0" angle="30"></a-light>

            <a-entity id="map-structures"></a-entity>

            <a-entity id="boss-container" position="0 4 -22" visible="false">
                <a-sphere id="boss-core" radius="3.5" material="color: #000"></a-sphere>
                <a-ring id="boss-eye" radius-inner="1.8" radius-outer="2.5" material="color: #ff0055; side: double"></a-ring>
            </a-entity>

            <a-text id="game-prompt" value="" align="center" position="0 3.5 -6" width="5.5"></a-text>
        </a-entity>
    </a-scene>

    <script>
        let selectedWoW = [];
        let timeSlowed = false;
        let currentMode = 'menu';
        let playerHP = 100;
        let eyeOpen = false;

        const rig = document.getElementById('rig');
        const knob = document.getElementById('joystick-knob');
        const boundary = document.getElementById('joystick-boundary');
        let moveX = 0, moveZ = 0;
        let isDraggingJoystick = false;

        // Mostrar controles si es celular
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) document.getElementById('mobile-controls').style.display = 'flex';

        // PROGRAMACIÓN CORRECTA DEL JOYSTICK (DIRECCIONES ARREGLADAS)
        boundary.addEventListener('touchstart', (e) => { isDraggingJoystick = true; updateJoystick(e.touches[0]); });
        window.addEventListener('touchmove', (e) => { if (isDraggingJoystick) updateJoystick(e.touches[0]); });
        window.addEventListener('touchend', () => {
            isDraggingJoystick = false;
            knob.style.top = '32px'; knob.style.left = '32px';
            moveX = 0; moveZ = 0;
        });

        function updateJoystick(touch) {
            const rect = boundary.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 32;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            knob.style.left = `${32 + deltaX}px`;
            knob.style.top = `${32 + deltaY}px`;
            
            // Corrección matemática de inversión de ejes
            moveX = deltaX / maxRadius;
            moveZ = deltaY / maxRadius;
        }

        // Bucle de movimiento fluido relativo al Rig completo del personaje
        setInterval(() => {
            if ((moveX !== 0 || moveZ !== 0) && currentMode !== 'menu') {
                let speed = timeSlowed ? 0.03 : 0.09;
                const cameraRotation = document.getElementById('camera').getAttribute('rotation');
                const angle = cameraRotation.y * (Math.PI / 180);
                
                // Mapeo corregido de coordenadas espaciales
                let forwardX = Math.sin(angle) * moveZ;
                let forwardZ = Math.cos(angle) * moveZ;
                let sideX = Math.cos(angle) * moveX;
                let sideZ = -Math.sin(angle) * moveX;

                let currentPos = rig.getAttribute('position');
                currentPos.x -= (forwardX + sideX) * speed;
                currentPos.z -= (forwardZ + sideZ) * speed;
                rig.setAttribute('position', currentPos);
            }
        }, 20);

        // FUNCIONES DE WAR OF WIZARDS
        function openWandMenu() { document.getElementById('wow-menu').style.display = 'flex'; }
        
        function selectWoWSpell(name) {
            const idx = selectedWoW.indexOf(name);
            if (idx > -1) selectedWoW.splice(idx, 1);
            else {
                if (selectedWoW.length >= 3) return;
                selectedWoW.push(name);
            }
            const buttons = document.querySelectorAll('.btn-wow');
            buttons.forEach(b => {
                if(selectedWoW.includes(b.innerText.split(' ')[1])) b.classList.add('selected');
                else b.classList.remove('selected');
            });
        }

        function confirmWoWSpells() {
            if(selectedWoW.length !== 3) { alert("¡Selecciona 3!"); return; }
            document.getElementById('wow-menu').style.display = 'none';
            document.getElementById('btn-wand').innerText = "Varita Lista";
            document.getElementById('spell-slots').innerText = `WoW: 3/3`;

            const container = document.getElementById('wow-cast-buttons');
            container.innerHTML = ''; container.classList.remove('hidden');
            selectedWoW.forEach(spell => {
                const btn = document.createElement('button');
                btn.className = 'btn-game'; btn.style.background = '#8b5a2b';
                btn.innerText = spell;
                btn.onclick = () => { spawnMagicSphere('#ffaa00', 0.3, 1200); };
                container.appendChild(btn);
            });
        }

        function castGojo(type, color) {
            let radius = type === 'Púrpura' ? 0.7 : 0.25;
            spawnMagicSphere(color, radius, type === 'Púrpura' ? 600 : 1200);
        }

        function spawnMagicSphere(color, radius, speed) {
            const sphere = document.createElement('a-sphere');
            sphere.setAttribute('radius', radius);
            sphere.setAttribute('color', color);
            sphere.setAttribute('material', 'emissive', color);
            
            // El hechizo sale de la posición del Rig de tu personaje, no del vacío
            let pPos = rig.getAttribute('position');
            sphere.setAttribute('position', `${pPos.x} 1.2 ${pPos.z - 1.5}`);
            sphere.setAttribute('animation', `property: position; to: ${pPos.x} 1.2 ${pPos.z - 30}; dur: ${speed}; easing: linear`);
            document.getElementById('game-world').appendChild(sphere);
        }

        // CONSTRUCCIÓN E INSTANCIACIÓN DEL MAPA Y LOS MANNEQUINS
        function loadMap(mode) {
            currentMode = mode;
            document.getElementById('main-menu').setAttribute('visible', 'false');
            document.getElementById('game-world').setAttribute('visible', 'true');
            
            const container = document.getElementById('map-structures');
            container.innerHTML = ''; 

            // Estructura física real del mapa
            createWall(container, "0 2.5 -15", "16 5 0.5", "#2e3138"); 
            createWall(container, "-8 2.5 -7", "0.5 5 15", "#2e3138");
            createWall(container, "8 2.5 -7", "0.5 5 15", "#2e3138");
            createWall(container, "-3 2.5 -6", "1.5 5 1.5", "#424651");
            createWall(container, "3 2.5 -10", "2 5 2", "#424651");

            // RENDERIZADO VISIBLE DE LOS MANNEQUINS EN EL MAPA
            if(mode !== 'bossfight') {
                document.getElementById('game-prompt').setAttribute('value', "Los Mannequins se ocultan en las columnas.");
                for(let i=0; i<4; i++) {
                    const mannequin = document.createElement('a-box');
                    mannequin.setAttribute('position', `${(Math.random() * 8) - 4} 0.9 -${8 + (i*2.5)}`);
                    mannequin.setAttribute('geometry', 'width: 0.6; height: 1.8; depth: 0.5');
                    mannequin.setAttribute('material', 'color: #8c8c8c; roughness: 0.9; metalness: 0.2');
                    container.appendChild(mannequin);
                }
            } else {
                document.getElementById('boss-container').setAttribute('visible', 'true');
                startBossLogic();
            }
        }

        function createWall(parent, pos, size, color) {
            const w = document.createElement('a-box');
            w.setAttribute('position', pos);
            w.setAttribute('geometry', `width: ${size.split(' ')[0]}; height: ${size.split(' ')[1]}; depth: ${size.split(' ')[2]}`);
            w.setAttribute('material', `color: ${color}`);
            parent.appendChild(w);
        }

        function startBossLogic() {
            const eye = document.getElementById('boss-eye');
            setInterval(() => {
                if (currentMode !== 'bossfight') return;
                eyeOpen = !eyeOpen;
                if(eyeOpen) {
                    eye.setAttribute('material', 'color', '#ff0033');
                    document.getElementById('game-prompt').setAttribute('value', "👁️ ¡EL OJO TE MIRA! ¡ESCÓNDETE DETRÁS DE UN BLOQUE!");
                    setTimeout(() => {
                        if(eyeOpen && Math.abs(rig.getAttribute('position').x) < 1.5) {
                            playerHP -= 20;
                            document.getElementById('player-hp').innerText = `Vida: ${playerHP}%`;
                            if(playerHP <= 0) { alert("Game Over"); location.reload(); }
                        }
                    }, 1000);
                } else {
                    eye.setAttribute('material', 'color', '#220005');
                    document.getElementById('game-prompt').setAttribute('value', "🔮 El ojo se cerró. ¡Ataca!");
                }
            }, 3000);
        }

        function triggerTimeSlow() {
            if (!timeSlowed) {
                timeSlowed = true;
                document.getElementById('time-slow-indicator').innerText = "⏱️ TIEMPO LENTO";
                setTimeout(() => {
                    timeSlowed = false;
                    document.getElementById('time-slow-indicator').innerText = "Tiempo Normal";
                }, 5000);
            }
        }

        // CONDICIÓN ESTRICTA DE APARICIÓN DE TON 618 (1 ENTRE 5)
        window.addEventListener('load', () => {
            const dice = Math.floor(Math.random() * 5) + 1;
            console.log("Número del dado obtenido: " + dice);
            
            if (dice === 5) {
                document.getElementById('ton618-sphere').setAttribute('visible', 'true');
                document.getElementById('btn-bossfight').setAttribute('visible', 'true'); // Ahora sí aparece solo si cumple el 1 de 5
            }
            
            document.getElementById('connection-status').innerText = navigator.onLine ? "🌐 Online" : "⚠️ Offline";
        });
    </script>
</body>
</html>
